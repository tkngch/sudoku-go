name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel a pull request run when a new commit supersedes it. Keep a run on
# main, because it deploys. A cancelled deploy leaves the site out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi
      - run: go vet ./...
      - name: go vet (js/wasm)
        env:
          GOOS: js
          GOARCH: wasm
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
      # The action above puts golangci-lint on PATH, so call the binary here.
      - name: golangci-lint (js/wasm)
        env:
          GOOS: js
          GOARCH: wasm
        run: golangci-lint run ./...
      # Install node after the Go checks. npm writes node_modules, and one
      # package there ships a Go file that the Go linters would report.
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Check the format of the browser scripts
        run: npm run format:check
      - name: Check the browser scripts
        run: npm run lint
      - run: make test
      - run: make web
      - run: make smoke
      # Keep the site that make web built above. The deploy job sends it, so
      # no second build is necessary.
      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    name: Deploy the site
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # deploy-pages waits 10 minutes for the Pages service. Allow more time
    # here, so the action reports the timeout itself.
    timeout-minutes: 15
    permissions:
      pages: write
      # id-token lets the job prove its identity to the Pages service.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  bench:
    name: Benchmark (advisory)
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check out PR base
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Benchmark base
        continue-on-error: true
        working-directory: base
        run: |
          go test -run='^$' -bench='^BenchmarkSolve$' -benchmem \
            -count=10 -timeout 20m ./internal/solver/ \
            | tee "${GITHUB_WORKSPACE}/base.txt"

      - name: Benchmark head
        continue-on-error: true
        run: |
          go test -run='^$' -bench='^BenchmarkSolve$' -benchmem \
            -count=10 -timeout 20m ./internal/solver/ \
            | tee "${GITHUB_WORKSPACE}/head.txt"

      - name: Compare with benchstat
        if: always()
        run: |
          {
            echo '### Benchmark — `internal/solver` (advisory, non-blocking)'
            echo
            echo "base \`${{ github.event.pull_request.base.sha }}\` → head \`${{ github.event.pull_request.head.sha }}\`"
            echo
            if grep -q '^Benchmark' base.txt; then
              echo '```'
              go tool benchstat base=base.txt head=head.txt || true
              echo '```'
            else
              echo '> No benchmarks on the base commit; showing head numbers only, no delta.'
              echo
              echo '```'
              go tool benchstat head=head.txt || cat head.txt
              echo '```'
            fi
            echo
            echo '_Advisory only — with n=10 on shared CI runners, both the deltas and the p-values are noisy, so treat neither as conclusive. Confirm anything surprising locally at a higher `-count`._'
            echo '<!-- benchstat-regression -->'
          } > comment.md
          cat comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post / update PR comment
        if: always() && github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- benchstat-regression -->'
          body="$(cat comment.md)"
          id=$(gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
                --jq "map(select(.body | contains(\"${marker}\"))) | .[0].id // empty")
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" -f body="$body" >/dev/null
          fi
