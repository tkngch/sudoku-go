name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job needs these permissions. id-token lets the job prove its
# identity to the Pages service.
permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish before the next one starts. Two quick pushes race the
# deploy without this group.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/configure-pages@v6
      - run: make web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    name: Deploy the site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
